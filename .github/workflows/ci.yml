name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # Postgres service for artifacts/api-server's DB-backed tests
    # (tests/pgRateLimitStore.test.ts). The store creates its own table on
    # first use (CREATE TABLE IF NOT EXISTS rate_limit_hits), so no schema
    # push/migration step is needed here — just a reachable database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isc_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to major 12 to match what this repo's lockfile actually
          # requires. pnpm-workspace.yaml uses workspace-level `overrides`,
          # `allowBuilds`, `onlyBuiltDependencies`, and `minimumReleaseAge`
          # settings that pnpm 9 does not read from pnpm-workspace.yaml at
          # all (those moved out of package.json's `pnpm` key in a later
          # pnpm release). Pinning to 9 made pnpm compute an empty override
          # set, which frozen-lockfile install then rejected against the
          # lockfile's real (86-entry) overrides block with
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH — failing this job's install
          # step on every run, before Typecheck/Test ever got to execute.
          # 12 is what Render's real (unpinnable) `npx pnpm` resolves to
          # today, confirmed via render-build-parity's install step, and is
          # the version pnpm-lock.yaml was actually generated under.
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test — frontend (artifacts/i-supply-chain)
        run: pnpm --filter ./artifacts/i-supply-chain run test
        continue-on-error: false

      - name: Test — API server (artifacts/api-server)
        run: pnpm --filter ./artifacts/api-server run test
        continue-on-error: false

  # Mirrors Render's actual buildCommands byte-for-byte (both isc-frontend
  # and isc-backend use unpinned `npx pnpm`, which Render's dashboard does
  # not let us edit or pin). Deliberately does NOT use pnpm/action-setup —
  # the whole point is to let npx resolve whatever pnpm currently tags
  # "latest" on the npm registry, exactly like Render does on every real
  # deploy, so a future pnpm-major breaking change fails HERE within
  # minutes of the push instead of silently breaking production for days.
  #
  # Added 2026-08-28 after discovering both Render services had been
  # failing every build since 2026-08-24 21:53:42 UTC: the typecheck-and-
  # test job above pins pnpm to 9 via pnpm/action-setup, so it stayed green
  # the entire time this was broken in production. That gap is what let a
  # ~4-day outage go unnoticed. See commit f8ae152 for the fix and root
  # cause; do not remove this job without an equivalent safeguard in place.
  #
  # These steps invoke each package's own `build` script by reference
  # (`npx pnpm --filter <pkg> build`), not a duplicated command string, so
  # this job automatically mirrors whatever that script actually does —
  # including the 2026-09-11 change that removed `pnpm run test` from both
  # packages' `build` scripts (Render's build should typecheck, not run the
  # full suite; that now runs in the typecheck-and-test job above, on a
  # properly-resourced runner with a real Postgres service). No separate
  # edit to this job was needed for it to pick that up.
  render-build-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (unpinned npx pnpm, matches Render)
        run: npx pnpm install --frozen-lockfile

      - name: Build frontend (matches isc-frontend buildCommand)
        env:
          PORT: "10000"
          BASE_PATH: "/"
        run: npx pnpm --filter @workspace/i-supply-chain build

      - name: Build API server (matches isc-backend buildCommand's final step)
        run: npx pnpm --filter @workspace/api-server build

# No-op deploy-gate verification marker (11 Sep 2026, registry #442):
# this single comment line was pushed specifically to observe whether
# Render's deploy for this commit starts immediately (gate NOT active)
# or waits until this workflow's own check runs report success (gate
# active) -- see Site Map v168/v169 for the result. Changes nothing
# functionally.
