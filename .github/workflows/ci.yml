name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test — frontend (artifacts/i-supply-chain)
        run: pnpm --filter ./artifacts/i-supply-chain run test
        continue-on-error: false

      - name: Test — API server (artifacts/api-server)
        run: pnpm --filter ./artifacts/api-server run test
        continue-on-error: false
