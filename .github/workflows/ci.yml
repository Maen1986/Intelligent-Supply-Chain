name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # Postgres service for artifacts/api-server's DB-backed tests
    # (tests/pgRateLimitStore.test.ts). The store creates its own table on
    # first use (CREATE TABLE IF NOT EXISTS rate_limit_hits), so no schema
    # push/migration step is needed here — just a reachable database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isc_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test — frontend (artifacts/i-supply-chain)
        run: pnpm --filter ./artifacts/i-supply-chain run test
        continue-on-error: false

      - name: Test — API server (artifacts/api-server)
        run: pnpm --filter ./artifacts/api-server run test
        continue-on-error: false
